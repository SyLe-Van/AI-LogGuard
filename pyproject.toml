[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-logguard"
version = "0.1.0"
description = "AI-powered CLI for CI/CD log analysis, failure prediction, and auto-fix suggestions"
readme = "README.md"
authors = [
    {name = "Sy Le", email = "your.email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["ci-cd", "devops", "log-analysis", "ai", "ml", "llm"]
dependencies = [
    "typer>=0.15.0",
    "rich==13.7.1",
    "requests==2.31.0",
    "pydantic>=2.10.0",
    "python-dotenv==1.0.1",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "black==26.3.1",
    "flake8==7.0.0",
    "mypy==1.9.0",
    "isort==5.13.2",
]

[project.urls]
Homepage = "https://github.com/SyLe-Van/AI-LogGuard"
Repository = "https://github.com/SyLe-Van/AI-LogGuard"
Issues = "https://github.com/SyLe-Van/AI-LogGuard/issues"

[project.scripts]
ai-logguard = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=html --cov-report=term"
